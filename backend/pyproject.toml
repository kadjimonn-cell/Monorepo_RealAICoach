[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E712", "E402", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]

[tool.ruff.format]
line-ending = "lf"


[tool.pytest.ini_options]
# web3's bundled pytest_ethereum plugin is broken against the installed eth_typing
# version (missing `ContractName`); disable it so our suite can actually collect.
addopts = "-p no:pytest_ethereum"
