<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Sign in with Microsoft</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{background:#1e293b;border-radius:16px;padding:32px;max-width:380px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.logo{font-size:20px;font-weight:700;margin-bottom:8px;color:#fff}
.logo span{color:#0ea5e9}
.subtitle{color:#94a3b8;font-size:14px;margin-bottom:24px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.2s;text-decoration:none}
.btn:active,.btn:hover{background:#1d4ed8}
.btn svg{width:20px;height:20px;flex-shrink:0}
.status{color:#94a3b8;font-size:13px;margin-top:16px;min-height:20px}
.back{display:block;margin-top:12px;color:#64748b;font-size:13px;text-decoration:none}
.back:hover{color:#94a3b8}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Real<span>AI</span>Coach</div>
  <p class="subtitle">Sign in with your Microsoft account</p>
  <a id="ms-btn" class="btn" href="/api/auth/microsoft/login" data-testid="ms-login-button">
    <svg viewBox="0 0 21 21" fill="none"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
    Sign in with Microsoft
  </a>
  <div id="status" class="status" data-testid="ms-login-status">Click the button above to continue</div>
  <a class="back" href="/auth/login" data-testid="ms-login-back">Back to login</a>
</div>
<script>
try { localStorage.setItem('last_login_method', 'microsoft'); } catch(e) {}
</script>
</body>
</html>
